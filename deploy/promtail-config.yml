server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: relayer
    journal:
      json: true
      matches: _SYSTEMD_UNIT=across-relayer.service
      labels:
        job: relayer
    pipeline_stages:
      - json:
          expressions:
            event_type: event_type
            at: at
            level: level
      - labels:
          event_type:
          level:
