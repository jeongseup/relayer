server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: relayer
    journal:
      json: false
      matches: _SYSTEMD_UNIT=across-relayer.service
      labels:
        job: relayer
    pipeline_stages:
      # journald에서 MESSAGE 필드 추출
      - json:
          expressions:
            log_line: MESSAGE
      # Winston JSON에서 label용 필드 추출
      - json:
          source: log_line
          expressions:
            level: level
            at: at
            event_type: event_type
            notificationPath: notificationPath
      # label 등록 (저 카디널리티만)
      - labels:
          level:
          at:
          event_type:
          notificationPath:
      # 본문은 Winston JSON 전체 (journald 메타데이터 제거)
      - output:
          source: log_line
