server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: relayer
    journal:
      json: true
      labels:
        job: relayer
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        target_label: "unit"
    pipeline_stages:
      - match:
          selector: '{unit="across-relayer.service"}'
          stages:
            - json:
                expressions:
                  event_type: event_type
                  at: at
                  level: level
            - labels:
                event_type:
                level:
