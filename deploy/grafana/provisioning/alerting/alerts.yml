apiVersion: 1

groups:
  - orgId: 1
    name: relayer
    folder: Relayer
    interval: 1m
    rules:
      - uid: relayer-down
        title: RelayerDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up{job="relayer"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Relayer /metrics endpoint unreachable"

      - uid: relayer-restart-loop
        title: RelayerRestartLoop
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: changes(process_start_time_seconds{job="relayer"}[10m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
              refId: C
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Relayer restarted more than 2 times in 10 minutes"
